aid: linqto
name: Linqto
description: Linqto is a San Jose, California private-markets investment platform that
  gives individual accredited investors access to equity in mid-to-late-stage private
  technology companies before an IPO or acquisition. Rather than operating as a marketplace
  intermediary, Linqto buys shares itself and delivers them to investors as units in a
  series-LLC private fund ("Liquidshares") that holds the underlying company's stock,
  with a stated single purchase-premium fee and no carry, profit, legal, or administrative
  fees. Investing runs through a web and mobile application at app.linqto.com covering
  accreditation and KYC/identity verification, a cash account funded by bank transfer or
  wire, order placement, and portfolio and document management. The company filed for
  Chapter 11 protection in the U.S. Bankruptcy Court for the Southern District of Texas
  in 2025 and has paused transactions while continuing operations. Linqto publishes no
  public developer API, SDK, OpenAPI, or developer portal; the only public machine-readable
  surfaces are the WordPress REST API and RSS feed behind its marketing site, and the
  investor application is served by a private, session-authenticated backend at
  api.app.linqto.com. This profile captures company identity, the discovered public
  surfaces, and the domain-security posture for the API Evangelist network.
