apis:
- aid: linqto:wordpress-rest-api
  name: Linqto WordPress REST API
  description: The linqto.com marketing, blog, and market-insights site runs on WordPress
    and exposes the standard public WordPress REST API at /wp-json/. The route index
    reports 472 routes across 19 namespaces (including wp/v2, oembed/1.0, yoast/v1 and
    contact-form-7/v1), providing JSON access to posts, pages, categories, tags, authors
    and media, with filtering, search and pagination. This is site infrastructure rather
    than a Linqto product API — Linqto publishes no developer documentation for it — but
    it is a real, anonymously callable, self-describing REST surface.
  humanURL: https://developer.wordpress.org/rest-api/
